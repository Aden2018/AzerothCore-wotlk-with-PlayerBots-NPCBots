name: tools
on:
  push:
    branches:
      - 'Playerbot'
  pull_request:
    types:
      - labeled
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.cc }}
    if: |
      github.repository == 'Aden2018/AzerothCore-wotlk-with-PlayerBots-NPCBots'
      && (
        github.event_name == 'push' && github.ref == 'refs/heads/Playerbot'
        ||
        (github.event_name == 'pull_request'
          && !github.event.pull_request.draft
          && contains(github.event.pull_request.labels.*.name, 'run-build'))
      )
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-build
        with:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          tools: all
          pch: false
