name: windows-build
on:
  push:
    branches: [ "Playerbot" ]
  pull_request:
    types:
      - labeled
      - synchronize

concurrency:
  # One concurrency group per workflow + ref.
  #
  # - PRs use `refs/pull/<PR_NUMBER>/merge`, so new commits cancel older
  #   in-progress runs for the same PR.
  # - When a PR is merged, a push to the target branch starts a new group,
  #   canceling any still-running PR CI.
  # - Branch pushes are isolated by ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
    if: github.repository == 'Aden2018/AzerothCore-wotlk-with-PlayerBots-NPCBots' && !github.event.pull_request.draft
    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@v4

      - name: Checkout Playerbot Module
        uses: actions/checkout@v4
        with:
          repository: Aden2018/mod-playerbots
          ref: ${{ github.ref_name == 'Playerbot' && 'master' || 'test-staging' }}
          path: modules/mod-playerbots

      - name: Move repo to short path
        shell: bash
        run: |
          mkdir C:/ac
          cp -r . C:/ac/

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.13
      - name: Configure OS
        shell: bash
        env:
          CONTINUOUS_INTEGRATION: true
        run: |
          ./acore.sh install-deps
      - name: Build
        shell: bash
        run: |
          cd C:/ac
          export CTOOLS_BUILD=all
          ./acore.sh compiler build
