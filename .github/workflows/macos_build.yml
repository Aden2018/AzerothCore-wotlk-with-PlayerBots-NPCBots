name: macos-build

on:
  push:
    branches:
      - "Playerbot"
  pull_request:
    types:
      - labeled
      - synchronize

concurrency:
  group: ${{ github.head_ref }} || concat(${{ github.ref_name }}, ${{ github.workflow }})
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  macos-build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    if: |
      github.repository == 'Aden2018/AzerothCore-wotlk-with-PlayerBots-NPCBots'
      && !github.event.pull_request.draft
      && (github.ref == 'refs/heads/Playerbot' || contains(github.event.pull_request.labels.*.name, 'run-build') || github.event.label.name == 'run-build')
    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@v4

      - name: Checkout Playerbot Module
        uses: actions/checkout@v4
        with:
          repository: Aden2018/mod-playerbots
          ref: ${{ github.ref_name == 'Playerbot' && 'master' || 'test-staging' }}
          path: modules/mod-playerbots

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache:${{ matrix.os }}:${{ github.ref_name }}
          restore-keys: |
            ccache:${{ matrix.os }}:${{ github.ref_name }}
            ccache:${{ matrix.os }}
      - name: reset ccache stats
        shell: bash
        run: ccache -z || true
      - name: Install latest bash
        run: brew install bash
      - name: Configure OS
        run: source ./acore.sh install-deps
      - name: Build
        run: source ./apps/ci/mac/ci-compile.sh
      - name: ccache stats
        shell: bash
        run: ccache -s || true
